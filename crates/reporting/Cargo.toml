[package]
name = "reporigor-reporting"
description = "Versioned JSON, human, SARIF, and mutation report formats for reporigor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The reporting integration suite validates the canonical schemas stored at the
# workspace root. It remains part of repository CI, but is excluded from the
# standalone crate so `cargo test` never depends on files outside its tarball.
exclude = ["tests/reporting.rs"]

[dependencies]
analysis-crap = { path = "../analysis-crap", version = "0.1.0" }
analysis-dry = { path = "../analysis-dry", version = "0.1.0" }
analysis-mutate = { path = "../analysis-mutate", version = "0.1.0" }
analysis-quality = { path = "../analysis-quality", version = "0.1.0" }
reporigor-core = { path = "../reporigor-core", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
