allow_missing_coverage = false
allow_empty = false

[dry]
min_tokens = 30
max_groups = 50
max_occurrences_per_window = 100
max_total_windows = 1000000
max_fingerprint_buckets = 500000
max_candidate_work = 10000000
fail = false

[mutation]
timeout_seconds = 120.0
