name: Pinned corpus regression

on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: Corpus tier to run
        required: true
        default: pull-request
        type: choice
        options:
          - pull-request
          - scheduled
      native:
        description: Also run lockfile-declared native modes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  regression:
    name: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.tier }} corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CORPUS_TIER: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.tier }}
    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Validate complete locked baselines without fetching
        shell: bash
        run: scripts/corpus-harness validate --tier "$CORPUS_TIER" --native --require-all

      - name: Explicitly populate pinned checkouts
        shell: bash
        run: scripts/corpus-harness populate --tier "$CORPUS_TIER" --require-all

      - name: Compare generic corpus reports
        shell: bash
        run: scripts/corpus-harness run --tier "$CORPUS_TIER" --require-all

      - name: Compare generic and declared native reports
        if: github.event_name == 'workflow_dispatch' && inputs.native
        shell: bash
        run: scripts/corpus-harness run --tier "$CORPUS_TIER" --native --require-all

      - name: Upload normalized diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-${{ env.CORPUS_TIER }}-${{ github.run_id }}
          path: target/corpus-harness/
          if-no-files-found: ignore
          retention-days: 14
